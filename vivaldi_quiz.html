<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>비발디 사계 퀴즈 🎻</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Fredoka+One&display=swap');

:root { --bg:#1a0050; --sub:#c0a0f0; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:#fff; min-height:100vh; overflow-x:hidden; }

/* floating notes */
.bg-notes{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.fnote{ position:absolute; opacity:0; animation:floatN 9s linear infinite; }
@keyframes floatN{
  0%  { transform:translateY(105vh) rotate(0deg);   opacity:0; }
  8%  { opacity:.15; }
  92% { opacity:.15; }
  100%{ transform:translateY(-8vh)  rotate(360deg); opacity:0; }
}

/* screens */
.screen{ display:none; min-height:100vh; position:relative; z-index:1; }
.screen.active{ display:flex; flex-direction:column; }

/* ─── START ─── */
#start-screen{
  align-items:center; justify-content:center; text-align:center; padding:2rem 1.5rem;
  background:radial-gradient(ellipse at 50% 0%,#5500cc 0%,#1a0050 68%);
}
.logo-ring{
  width:110px; height:110px; border-radius:50%;
  background:linear-gradient(135deg,#ffd700,#ff6b00);
  display:flex; align-items:center; justify-content:center;
  font-size:3.4rem; margin:0 auto 1.2rem;
  box-shadow:0 0 50px rgba(255,160,0,.55);
  animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ transform:scale(1);    box-shadow:0 0 40px rgba(255,160,0,.5); }
  50%    { transform:scale(1.07); box-shadow:0 0 70px rgba(255,160,0,.8); }
}
.start-title{
  font-family:'Fredoka One',cursive; font-size:clamp(2rem,7vw,3rem);
  background:linear-gradient(135deg,#ffd700 0%,#ff88cc 50%,#88aaff 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  line-height:1.2; margin-bottom:.5rem;
}
.start-sub{ color:var(--sub); font-size:1.05rem; margin-bottom:1.6rem; }
.chips{ display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center; margin-bottom:1.8rem; }
.chip{ padding:.35rem 1rem; border-radius:999px; font-size:.9rem; font-weight:700; backdrop-filter:blur(6px); }
.cs{ background:rgba(255,180,180,.22); border:1.5px solid #ff9999; }
.cu{ background:rgba(255,230,100,.22); border:1.5px solid #ffd740; }
.ca{ background:rgba(255,150,50,.22);  border:1.5px solid #ff8c00; }
.cw{ background:rgba(160,210,255,.22); border:1.5px solid #88ccff; }
.info-box{
  background:rgba(255,255,255,.07); border-radius:14px;
  padding:.9rem 1.5rem; max-width:320px; margin-bottom:2rem;
  font-size:.9rem; color:var(--sub); line-height:1.8; text-align:center;
}
.info-box strong{ color:#ffd700; }
.btn-start{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  border:none; color:#fff; font-size:1.35rem; font-weight:900;
  font-family:'Noto Sans KR',sans-serif;
  padding:1rem 3rem; border-radius:999px; cursor:pointer;
  box-shadow:0 6px 35px rgba(168,85,247,.55); transition:transform .15s;
}
.btn-start:active{ transform:scale(.96); }

/* ─── QUIZ HEADER ─── */
#quiz-screen{ overflow:hidden; }
.qhdr{
  background:rgba(0,0,0,.38); padding:.65rem 1rem;
  display:flex; align-items:center; gap:.7rem; flex-shrink:0;
}
.qnum{ font-size:.82rem; font-weight:700; color:var(--sub); white-space:nowrap; }
.tbar-wrap{ flex:1; height:13px; background:rgba(255,255,255,.14); border-radius:999px; overflow:hidden; }
.tbar{ height:100%; border-radius:999px; width:100%; transition:width 1s linear; background:linear-gradient(90deg,#a855f7,#ec4899); }
.tnum{ font-family:'Fredoka One',cursive; font-size:1.25rem; min-width:2rem; text-align:center; }
.sbadge{
  background:rgba(255,215,0,.18); border:1.5px solid #ffd700;
  border-radius:999px; padding:.2rem .75rem; font-size:.82rem;
  font-weight:700; color:#ffd700; white-space:nowrap;
}

/* ─── QUESTION CARD ─── */
.q-card{
  background:rgba(255,255,255,.07); margin:.7rem;
  border-radius:16px; padding:1rem 1rem .9rem;
  display:flex; flex-direction:column; align-items:center;
  text-align:center; flex-shrink:0;
}
.q-em  { font-size:2.5rem; margin-bottom:.4rem; }
.q-txt { font-size:clamp(.95rem,3.2vw,1.2rem); font-weight:700; line-height:1.45; max-width:560px; }
.q-hint{ margin-top:.4rem; font-size:.82rem; color:var(--sub); font-style:italic; }

/* ─── AUDIO CARD ─── */
.audio-card{
  margin:0 .7rem .6rem;
  background:linear-gradient(135deg,#1e0060,#3d0099);
  border:2px solid rgba(168,85,247,.5);
  border-radius:16px; padding:1rem;
  display:flex; flex-direction:column; align-items:center; gap:.7rem; flex-shrink:0;
}
.audio-visual{ display:flex; align-items:flex-end; gap:5px; height:44px; }
.bar{
  width:7px; border-radius:4px;
  background:linear-gradient(180deg,#a855f7,#ec4899);
  transform:scaleY(.3); transform-origin:bottom;
}
.audio-card.playing .bar{ animation:barB .7s ease-in-out infinite; }
@keyframes barB{
  0%,100%{ transform:scaleY(.25); }
  50%    { transform:scaleY(1); }
}
.audio-label{ font-size:.85rem; color:var(--sub); text-align:center; line-height:1.5; }
.btn-play{
  background:linear-gradient(135deg,#a855f7,#ec4899);
  border:none; color:#fff; font-size:1.1rem; font-weight:900;
  font-family:'Noto Sans KR',sans-serif;
  padding:.8rem 2.2rem; border-radius:999px; cursor:pointer;
  box-shadow:0 4px 22px rgba(168,85,247,.55);
  display:flex; align-items:center; gap:.5rem; transition:transform .15s;
}
.btn-play:active{ transform:scale(.94); }
.played-badge{
  display:none; background:rgba(76,175,80,.2); border:1.5px solid #4caf50;
  border-radius:999px; padding:.25rem 1rem; font-size:.82rem;
  font-weight:700; color:#4caf50;
}

/* ─── MAP ─── */
.map-wrap{
  margin:0 .7rem .6rem; border-radius:12px; overflow:hidden;
  background:#0d3b5e; display:flex; justify-content:center; flex-shrink:0;
}
.map-wrap svg{ max-width:100%; max-height:195px; }

/* ─── ANSWERS ─── */
.answers{
  display:grid; grid-template-columns:1fr 1fr;
  gap:.65rem; padding:0 .7rem .7rem; flex:1;
}
.ans-btn{
  border:none; border-radius:14px; padding:.85rem .5rem;
  font-family:'Noto Sans KR',sans-serif;
  font-size:clamp(.9rem,2.8vw,1.15rem); font-weight:700; color:#fff;
  cursor:pointer; display:flex; align-items:center; gap:.45rem;
  justify-content:center; text-align:center; line-height:1.3;
  min-height:68px; transition:transform .15s;
}
.ans-btn:active{ transform:scale(.95); }
.shape{ width:26px; height:26px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.95rem; }
.ans-btn:nth-child(1){ background:#c82424; box-shadow:0 4px 14px rgba(200,36,36,.4); }
.ans-btn:nth-child(2){ background:#0f50b0; box-shadow:0 4px 14px rgba(15,80,176,.4); }
.ans-btn:nth-child(3){ background:#a87200; box-shadow:0 4px 14px rgba(168,114,0,.4); }
.ans-btn:nth-child(4){ background:#207530; box-shadow:0 4px 14px rgba(32,117,48,.4); }
.ans-btn.correct{ animation:flashOk .5s ease forwards; pointer-events:none; }
.ans-btn.wrong  { opacity:.38; pointer-events:none; }
.ans-btn.disabled{ pointer-events:none; }
@keyframes flashOk{
  0%  { filter:brightness(1); }
  50% { filter:brightness(2); transform:scale(1.05); }
  100%{ filter:brightness(1.35); }
}

/* ─── FEEDBACK BAR ─── */
.fb-bar{
  display:none; position:fixed; bottom:0; left:0; right:0;
  padding:1rem 1.2rem; z-index:100;
  flex-direction:row; align-items:center; gap:.8rem;
  animation:slideUp .35s ease;
}
.fb-bar.show{ display:flex; }
.fb-bar.ok { background:linear-gradient(135deg,#165a22,#27ae60); }
.fb-bar.bad{ background:linear-gradient(135deg,#6b0000,#d32f2f); }
@keyframes slideUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
.fb-icon { font-size:2rem; flex-shrink:0; }
.fb-texts h3{ font-size:1rem; font-weight:900; }
.fb-texts p { font-size:.78rem; opacity:.9; margin-top:.2rem; line-height:1.4; }
.btn-next{
  margin-left:auto; background:rgba(255,255,255,.22);
  border:2px solid rgba(255,255,255,.45); color:#fff;
  font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:.95rem;
  padding:.55rem 1.2rem; border-radius:999px; cursor:pointer; flex-shrink:0;
}

/* ─── RESULT ─── */
#result-screen{
  align-items:center; justify-content:center; padding:2rem 1.5rem; gap:.9rem;
  text-align:center;
  background:radial-gradient(ellipse at 50% 0%,#4a0099 0%,#1a0050 70%);
}
.res-trophy{ font-size:5rem; animation:bounceIn .8s cubic-bezier(.36,1.56,.64,1); }
@keyframes bounceIn{
  from{ transform:scale(0) rotate(-20deg); opacity:0; }
  to  { transform:scale(1) rotate(0);      opacity:1; }
}
.res-title{
  font-family:'Fredoka One',cursive; font-size:2.2rem;
  background:linear-gradient(135deg,#ffd700,#ff88cc);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.res-score{ font-family:'Fredoka One',cursive; font-size:4rem; color:#ffd700; text-shadow:0 0 30px rgba(255,215,0,.6); line-height:1; }
.res-sub  { color:var(--sub); font-size:.95rem; }
.res-stars{ font-size:2rem; letter-spacing:.3rem; }
.res-msg  { font-size:1rem; font-weight:700; max-width:300px; line-height:1.6; }
.res-table{ background:rgba(255,255,255,.07); border-radius:16px; padding:.9rem 1.3rem; width:100%; max-width:360px; text-align:left; }
.res-row  { display:flex; justify-content:space-between; padding:.28rem 0; font-size:.85rem; }
.ok-c { color:#4caf50; }
.bad-c{ color:#ef5350; }
.btn-retry{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  border:none; color:#fff; font-size:1.15rem; font-weight:900;
  font-family:'Noto Sans KR',sans-serif;
  padding:.85rem 2.5rem; border-radius:999px; cursor:pointer;
  box-shadow:0 6px 30px rgba(168,85,247,.5);
}
/* confetti */
.cpiece{ position:fixed; top:-12px; border-radius:2px; pointer-events:none; z-index:200; animation:cfall 1.6s ease-in forwards; }
@keyframes cfall{ to{ transform:translateY(110vh) rotate(720deg); opacity:0; } }
</style>
</head>
<body>

<div class="bg-notes" id="bgNotes"></div>

<!-- ═══ START ═══ -->
<div class="screen active" id="start-screen">
  <div class="logo-ring">🎻</div>
  <div class="start-title">비발디 사계<br>퀴즈 대결!</div>
  <div class="start-sub">4주간 배운 내용을 퀴즈로 복습해요 🎶</div>
  <div class="chips">
    <span class="chip cs">🌸 봄</span>
    <span class="chip cu">☀️ 여름</span>
    <span class="chip ca">🍂 가을</span>
    <span class="chip cw">❄️ 겨울</span>
  </div>
  <div class="info-box">
    📌 총 <strong>10문제</strong> &nbsp;|&nbsp; ⏱ 기본 <strong>20초</strong><br>
    🎵 음악 청음 문제: <strong>60초</strong><br>
    🗺️ 지도 맞추기 포함 &nbsp;|&nbsp; 🎻 비발디 생애 포함
  </div>
  <button class="btn-start" onclick="startQuiz()">퀴즈 시작! 🚀</button>
</div>

<!-- ═══ QUIZ ═══ -->
<div class="screen" id="quiz-screen">
  <div class="qhdr">
    <span class="qnum" id="qNum">1 / 10</span>
    <div class="tbar-wrap"><div class="tbar" id="tBar"></div></div>
    <span class="tnum" id="tNum">20</span>
    <span class="sbadge" id="sBadge">⭐ 0</span>
  </div>
  <div class="q-card" id="qCard">
    <div class="q-em"   id="qEm"></div>
    <div class="q-txt"  id="qTxt"></div>
    <div class="q-hint" id="qHint"></div>
  </div>
  <div id="mediaArea"></div>
  <div class="answers" id="ansGrid"></div>
  <div class="fb-bar" id="fbBar">
    <span class="fb-icon" id="fbIcon"></span>
    <div class="fb-texts">
      <h3 id="fbTitle"></h3>
      <p  id="fbExpl"></p>
    </div>
    <button class="btn-next" onclick="nextQ()">다음 ▶</button>
  </div>
</div>

<!-- ═══ RESULT ═══ -->
<div class="screen" id="result-screen">
  <div class="res-trophy" id="rTrophy">🏆</div>
  <div class="res-title"  id="rTitle">대단해요!</div>
  <div class="res-score"  id="rScore">0 / 10</div>
  <div class="res-sub">맞은 문제 수</div>
  <div class="res-stars"  id="rStars">⭐⭐⭐</div>
  <div class="res-msg"    id="rMsg"></div>
  <div class="res-table"  id="rTable"></div>
  <button class="btn-retry" onclick="startQuiz()">🔄 다시 풀기</button>
</div>

<script>
/* ── Italy SVG ── */

    em:"❄️",type:"audio",t:60,
    q:"🎵 음악을 듣고 사계 중 어느 계절인지 맞춰보세요!",
    hint:"▶ 아래 버튼을 눌러 유튜브에서 음악을 들어보세요.",
    yt:"https://www.youtube.com/watch?v=K325j7QHIPM",
    season_img:"❄️⛄🌨️🥶",
    opts:["봄 🌸","여름 ☀️","가을 🍂","겨울 ❄️"],
    ans:3,
    ex:"비발디 사계 '겨울(L'Inverno)' 1악장! 차가운 겨울바람과 눈 속에서 떨고 있는 모습을 표현했습니다. ⛄"
  },
  {
    em:"🔢",type:"text",t:20,
    q:"비발디 '사계(四季)'는 총 몇 개의 바이올린 협주곡으로 이루어져 있나요?",
    hint:"'사(四)'라는 한자를 떠올려 봐요!",
    opts:["4개","6개","8개","12개"],
    ans:0,
    ex:"사계(四季) = 봄·여름·가을·겨울, 4개의 바이올린 협주곡으로 이루어져 있습니다! 🌸☀️🍂❄️"
  },
  {
    em:"🎶",type:"text",t:20,
    q:"비발디 사계에서 각 계절의 음악은 총 몇 악장(부분)으로 이루어져 있나요?",
    hint:"빠름 → 느림 → 빠름 형식이에요!",
    opts:["3악장","2악장","4악장","5악장"],
    ans:0,
    ex:"각 계절은 '빠름(Allegro)–느림(Largo)–빠름(Allegro)' 형식의 3악장으로 구성됩니다. 🎵🎵🎵"
  }
];

/* ── Floating notes init ── */
(function(){
  const pool=['♩','♪','♫','♬','🎵','🎶','🎻'];
  const wrap=document.getElementById('bgNotes');
  for(let i=0;i<18;i++){
    const el=document.createElement('span');
    el.className='fnote';
    el.textContent=pool[Math.floor(Math.random()*pool.length)];
    el.style.left=Math.random()*100+'%';
    el.style.animationDelay=Math.random()*9+'s';
    el.style.animationDuration=(6+Math.random()*6)+'s';
    el.style.fontSize=(1.1+Math.random()*1.3)+'rem';
    wrap.appendChild(el);
  }
})();

/* ── Game state ── */
let cQ=0,score=0,tmr=null,tLeft=20,done=false,results=[];

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz(){
  cQ=0; score=0; results=[]; done=false;
  showScreen('quiz-screen');
  renderQ();
}

/* ── Render question ── */
function renderQ(){
  done=false;
  const q=QS[cQ];
  document.getElementById('qNum').textContent  =`${cQ+1} / ${QS.length}`;
  document.getElementById('sBadge').textContent=`⭐ ${score}`;
  document.getElementById('qEm').textContent   =q.em;
  document.getElementById('qTxt').textContent  =q.q;
  document.getElementById('qHint').textContent =q.hint||'';

  const ma=document.getElementById('mediaArea');
  ma.innerHTML='';

  if(q.type==='map'){
    ma.innerHTML=`<div class="map-wrap">${MAP_SVG}</div>`;
  }
  else if(q.type==='audio'){
    /* animated bars */
    const bars=Array.from({length:9},(_,i)=>`
      <div class="bar" style="height:${14+Math.random()*26}px;
        animation-delay:${i*0.09}s;
        animation-duration:${0.45+Math.random()*0.45}s;"></div>`).join('');
    ma.innerHTML=`
      <div class="audio-card" id="audioCard">
        <div style="font-size:2rem;letter-spacing:.3rem">${q.season_img}</div>
        <div class="audio-visual">${bars}</div>
        <div class="audio-label">
          아래 버튼을 눌러 음악을 들은 후 정답을 선택하세요!<br>
          <small style="opacity:.65">▸ 유튜브가 새 창(탭)에서 열립니다</small>
        </div>
        <button class="btn-play" id="btnPlay" onclick="playAudio()">
          ▶&nbsp;&nbsp;음악 듣기
        </button>
        <div class="played-badge" id="playedBadge">✅ 들었어요!</div>
      </div>`;
  }

  /* answer buttons */
  const shapes=['▲','●','■','★'];
  const bgCols=['#c82424','#0f50b0','#a87200','#207530'];
  const grid=document.getElementById('ansGrid');
  grid.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='ans-btn';
    b.innerHTML=`<span class="shape">${shapes[i]}</span>${opt}`;
    b.style.background=bgCols[i];
    b.style.boxShadow=`0 4px 14px ${bgCols[i]}66`;
    b.addEventListener('click',()=>pick(i));
    grid.appendChild(b);
  });

  document.getElementById('fbBar').classList.remove('show','ok','bad');
  startTimer(q.t);
}

/* ── Open YouTube in new tab ── */
function playAudio(){
  const q=QS[cQ];
  window.open(q.yt,'_blank');
  document.getElementById('playedBadge').style.display='flex';
  document.getElementById('audioCard').classList.add('playing');
  /* pause timer briefly to let student listen */
  clearInterval(tmr);
  tmr=setInterval(()=>{
    tLeft--;
    updateTimer();
    if(tLeft<=0){ clearInterval(tmr); if(!done) pick(-1); }
  },1000);
}

/* ── Timer ── */
function startTimer(sec){
  clearInterval(tmr);
  tLeft=sec;
  updateTimer();
  tmr=setInterval(()=>{
    tLeft--;
    updateTimer();
    if(tLeft<=0){ clearInterval(tmr); if(!done) pick(-1); }
  },1000);
}
function updateTimer(){
  const q=QS[cQ];
  document.getElementById('tNum').textContent=tLeft;
  document.getElementById('tBar').style.width=(tLeft/q.t*100)+'%';
  const bar=document.getElementById('tBar');
  bar.style.background=tLeft<=5
    ?'linear-gradient(90deg,#ff2222,#ff0000)'
    :tLeft<=10
      ?'linear-gradient(90deg,#ff8c00,#ffd700)'
      :'linear-gradient(90deg,#a855f7,#ec4899)';
}

/* ── Pick answer ── */
function pick(idx){
  if(done)return;
  done=true;
  clearInterval(tmr);
  const q=QS[cQ];
  const ok=(idx===q.ans);
  if(ok){ score++; spawnConfetti(); }
  results.push({qi:cQ,ok,timeout:idx===-1});

  document.querySelectorAll('.ans-btn').forEach((b,i)=>{
    b.classList.add(i===q.ans?'correct':'wrong','disabled');
  });
  document.getElementById('sBadge').textContent=`⭐ ${score}`;

  const fb=document.getElementById('fbBar');
  fb.classList.add('show',ok?'ok':'bad');
  document.getElementById('fbIcon').textContent =ok?'🎉':idx===-1?'⏰':'😅';
  document.getElementById('fbTitle').textContent=ok
    ?'정답! 훌륭해요! 🥳'
    :idx===-1
      ?`시간 초과! 정답은 "${q.opts[q.ans]}"`
      :`오답! 정답은 "${q.opts[q.ans]}"`;
  document.getElementById('fbExpl').textContent=q.ex;
}

/* ── Next ── */
function nextQ(){
  cQ++;
  if(cQ>=QS.length) showResult();
  else renderQ();
}

/* ── Results ── */
function showResult(){
  showScreen('result-screen');
  const pct=score/QS.length;
  let trophy,title,stars,msg;
  if(pct>=.9){trophy='🏆';title='완벽해요!';    stars='⭐⭐⭐⭐⭐';msg='비발디 사계 전문가! 정말 대단해요! 🎻✨';}
  else if(pct>=.7){trophy='🥇';title='잘했어요!';stars='⭐⭐⭐⭐'; msg='비발디 사계를 잘 이해하고 있어요! 👏';}
  else if(pct>=.5){trophy='🥈';title='좋아요!';  stars='⭐⭐⭐';   msg='조금 더 복습하면 완벽해져요! 📚';}
  else            {trophy='🎵';title='다시 도전!';stars='⭐⭐';    msg='수업 내용을 다시 복습하고 도전해봐요! 💪';}
  document.getElementById('rTrophy').textContent=trophy;
  document.getElementById('rTitle').textContent =title;
  document.getElementById('rScore').textContent =`${score} / ${QS.length}`;
  document.getElementById('rStars').textContent =stars;
  document.getElementById('rMsg').textContent   =msg;
  document.getElementById('rTable').innerHTML=`
    <div style="font-weight:900;text-align:center;margin-bottom:.5rem;">📊 결과 요약</div>
    ${results.map((r,i)=>`
      <div class="res-row">
        <span>Q${i+1}. ${QS[r.qi].q.slice(0,16)}…</span>
        <span class="${r.ok?'ok-c':'bad-c'}">${r.ok?'✅ 정답':r.timeout?'⏰ 초과':'❌ 오답'}</span>
      </div>`).join('')}
    <div class="res-row" style="border-top:1px solid rgba(255,255,255,.15);margin-top:.5rem;padding-top:.5rem;font-weight:700;">
      <span>총점</span><span style="color:#ffd700">${score}점 / ${QS.length}점</span>
    </div>`;
  if(pct>=.7) setTimeout(()=>{for(let i=0;i<40;i++) spawnConfetti();},300);
}

/* ── Confetti ── */
function spawnConfetti(){
  const cols=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9a3c','#fff'];
  for(let i=0;i<14;i++){
    const el=document.createElement('div');
    el.className='cpiece';
    el.style.left=(15+Math.random()*70)+'%';
    el.style.width=el.style.height=(6+Math.random()*8)+'px';
    el.style.background=cols[Math.floor(Math.random()*cols.length)];
    el.style.transform=`rotate(${Math.random()*360}deg)`;
    el.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2200);
  }
}
</script>
</body>
</html>
