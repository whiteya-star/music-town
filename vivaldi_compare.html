<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>비발디 사계 × 지금 우리 계절</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:#1a1a2e;
  display:flex;flex-direction:column;
  height:100vh; overflow:hidden;
}

/* ── SEASON SWITCHER TOP BAR ── */
.top-bar{
  display:flex;align-items:center;gap:0;
  background:#12122a;
  padding:.45rem .8rem;
  flex-shrink:0;
  justify-content:space-between;
}
.season-tabs{display:flex;gap:.35rem;}
.s-tab{
  padding:.35rem .9rem;border-radius:999px;border:none;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;font-size:.75rem;font-weight:700;
  color:rgba(255,255,255,.45);background:rgba(255,255,255,.08);
  transition:all .2s;
}
.s-tab.active{color:#fff;}
.s-tab.spring.active{background:#3a7d44;}
.s-tab.summer.active{background:#c07000;}
.s-tab.autumn.active{background:#b84c1c;}
.s-tab.winter.active{background:#1a6a9a;}
.top-right{display:flex;gap:.4rem;}
.top-btn{
  padding:.35rem .7rem;border-radius:8px;border:none;cursor:pointer;
  font-size:.72rem;font-family:'Noto Sans KR',sans-serif;font-weight:700;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);transition:background .2s;
}
.top-btn:hover{background:rgba(255,255,255,.2);}
.top-btn.print-btn{background:rgba(255,255,255,.18);color:#fff;}

/* ── MAIN LAYOUT ── */
.main{
  flex:1;display:grid;
  grid-template-rows:auto 1fr auto;
  gap:0;overflow:hidden;
  padding:.5rem .6rem .4rem;
}

/* ── TITLE ROW ── */
.title-row{
  display:grid;grid-template-columns:1fr auto 1fr;
  gap:.5rem;align-items:center;
  margin-bottom:.45rem;
}
.col-title{
  padding:.5rem .8rem;border-radius:10px;text-align:center;
}
.col-title.vivaldi{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);}
.col-title.now{background:rgba(255,80,80,.1);border:1.5px solid rgba(255,100,100,.2);}
.col-title h2{font-size:.85rem;font-weight:700;color:#fff;line-height:1.3;}
.col-title p{font-size:.68rem;color:rgba(255,255,255,.5);margin-top:2px;}
.vs-badge{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:900;color:rgba(255,255,255,.6);
  flex-shrink:0;
}

/* ── DROP ZONES ── */
.drop-row{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.5rem;overflow:hidden;
}
.drop-zone{
  border-radius:14px;border:2.5px dashed rgba(255,255,255,.2);
  background:rgba(255,255,255,.04);
  padding:.5rem;overflow-y:auto;
  display:flex;flex-wrap:wrap;
  align-content:flex-start;
  gap:.4rem;
  transition:border-color .2s,background .2s;
  min-height:100px;
  position:relative;
}
.drop-zone.vivaldi-zone{border-color:rgba(120,200,120,.3);}
.drop-zone.now-zone{border-color:rgba(255,120,100,.3);}
.drop-zone.drag-over{
  border-color:#fff !important;
  background:rgba(255,255,255,.1) !important;
}
.drop-hint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;pointer-events:none;
  opacity:1;transition:opacity .2s;
}
.drop-hint.hidden{opacity:0;}
.drop-hint-icon{font-size:1.6rem;opacity:.3;}
.drop-hint-text{font-size:.7rem;color:rgba(255,255,255,.3);text-align:center;}

/* ── DROPPED CARDS ── */
.dropped-card{
  background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.15);
  border-radius:10px;padding:.4rem .5rem;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:grab;transition:transform .15s,opacity .15s;
  width:calc(50% - .2rem);
  position:relative;
}
.dropped-card:active{cursor:grabbing;transform:scale(.95);}
.dropped-card .d-emoji{font-size:1.5rem;}
.dropped-card .d-name{font-size:.62rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.2;}
.dropped-card .remove-btn{
  position:absolute;top:-5px;right:-5px;
  width:18px;height:18px;border-radius:50%;
  background:#e74c3c;border:none;color:#fff;
  font-size:.65rem;cursor:pointer;display:none;
  align-items:center;justify-content:center;line-height:1;
}
.dropped-card:hover .remove-btn{display:flex;}
/* mobile: always show remove btn */
@media (pointer:coarse){
  .dropped-card .remove-btn{display:flex;}
}

/* ── CARD TRAY (source) ── */
.tray-area{
  margin-top:.45rem;
  background:rgba(255,255,255,.04);
  border-radius:12px;
  padding:.45rem .5rem .4rem;
  border:1px solid rgba(255,255,255,.08);
  flex-shrink:0;
}
.tray-label{
  font-size:.65rem;font-weight:700;color:rgba(255,255,255,.4);
  letter-spacing:.05em;text-transform:uppercase;
  margin-bottom:.35rem;text-align:center;
}
.tray-cards{
  display:flex;flex-wrap:wrap;gap:.35rem;
  justify-content:center;
}
.tray-card{
  background:rgba(255,255,255,.1);
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:.45rem .55rem;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:grab;transition:transform .2s,opacity .2s,box-shadow .2s;
  flex-shrink:0;
  touch-action:none;
}
.tray-card:active{cursor:grabbing;transform:scale(.92);}
.tray-card.dragging{opacity:.4;transform:scale(.88);}
.tray-card .tc-emoji{font-size:1.4rem;}
.tray-card .tc-name{font-size:.62rem;color:rgba(255,255,255,.65);text-align:center;}
.tray-card.used{opacity:.25;pointer-events:none;}

/* ── FEELING SELECTOR ── */
.feeling-row{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.5rem;margin-top:.4rem;
}
.feeling-zone{
  background:rgba(255,255,255,.05);border-radius:10px;
  padding:.4rem .5rem;display:flex;gap:.3rem;flex-wrap:wrap;
  justify-content:center;
}
.feel-btn{
  padding:.28rem .65rem;border-radius:999px;border:1.5px solid rgba(255,255,255,.2);
  background:transparent;color:rgba(255,255,255,.55);
  font-size:.72rem;font-family:'Noto Sans KR',sans-serif;font-weight:700;
  cursor:pointer;transition:all .18s;
}
.feel-btn:active{transform:scale(.93);}
.feel-btn.selected-v{background:#3a7d44;border-color:#3a7d44;color:#fff;}
.feel-btn.selected-n{background:#c0392b;border-color:#c0392b;color:#fff;}

/* ── COMPLETE OVERLAY ── */
.complete-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  z-index:100;flex-direction:column;
  align-items:center;justify-content:center;
  gap:1rem;text-align:center;padding:2rem;
}
.complete-overlay.show{display:flex;}
.co-emoji{font-size:4rem;animation:pop .6s cubic-bezier(.36,1.56,.64,1);}
@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
.co-title{font-family:'Gaegu',cursive;font-size:2rem;color:#fff;}
.co-sub{font-size:.9rem;color:rgba(255,255,255,.7);max-width:280px;line-height:1.6;}
.co-btns{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem;}
.co-btn{
  padding:.75rem 1.6rem;border-radius:999px;border:none;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:.9rem;
}
.co-btn.main{background:#3a7d44;color:#fff;}
.co-btn.sec{background:rgba(255,255,255,.15);color:#fff;}

/* ── GHOST CARD (drag visual) ── */
#ghost{
  position:fixed;pointer-events:none;z-index:200;
  background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);
  border-radius:10px;padding:.5rem .7rem;
  display:none;flex-direction:column;align-items:center;gap:2px;
  backdrop-filter:blur(4px);
  transform:translate(-50%,-50%) scale(1.1);
}
#ghost .g-emoji{font-size:1.6rem;}
#ghost .g-name{font-size:.65rem;color:#fff;}

/* print */
@media print{
  body{background:#fff;overflow:auto;}
  .top-bar,.tray-area,.feeling-row,.top-right{display:none!important;}
  .drop-zone{border:2px solid #ccc;background:#fafafa;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .main{overflow:visible;height:auto;}
  html,body{height:auto;overflow:auto;}
  .drop-row{min-height:300px;}
  .dropped-card{background:#eee;border:1px solid #ccc;}
  .dropped-card .remove-btn{display:none!important;}
}
</style>
</head>
<body>

<!-- Ghost drag element -->
<div id="ghost"><div class="g-emoji" id="ghostEmoji"></div><div class="g-name" id="ghostName"></div></div>

<!-- Complete overlay -->
<div class="complete-overlay" id="completeOverlay">
  <div class="co-emoji">🌍</div>
  <div class="co-title" id="coTitle">잘 했어요!</div>
  <div class="co-sub" id="coSub">비발디의 계절과 지금 우리 계절을 비교했어요!</div>
  <div class="co-btns">
    <button class="co-btn main" onclick="window.print()">🖨️ 인쇄하기</button>
    <button class="co-btn sec"  onclick="document.getElementById('completeOverlay').classList.remove('show')">✏️ 계속 하기</button>
  </div>
</div>

<!-- Top bar -->
<div class="top-bar">
  <div class="season-tabs">
    <button class="s-tab spring active" onclick="switchSeason('spring')">🌸 봄</button>
    <button class="s-tab summer"        onclick="switchSeason('summer')">☀️ 여름</button>
    <button class="s-tab autumn"        onclick="switchSeason('autumn')">🍂 가을</button>
    <button class="s-tab winter"        onclick="switchSeason('winter')">❄️ 겨울</button>
  </div>
  <div class="top-right">
    <button class="top-btn" onclick="resetAll()">🔄 다시</button>
    <button class="top-btn print-btn" onclick="checkComplete()">✅ 완성!</button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <!-- Title row -->
  <div class="title-row">
    <div class="col-title vivaldi">
      <h2 id="vivaldiTitle">🎻 비발디의 봄</h2>
      <p>음악이 표현한 계절</p>
    </div>
    <div class="vs-badge">VS</div>
    <div class="col-title now">
      <h2 id="nowTitle">🌍 지금 우리의 봄</h2>
      <p>기후변화로 달라진 계절</p>
    </div>
  </div>

  <!-- Drop zones -->
  <div class="drop-row">
    <div class="drop-zone vivaldi-zone" id="zoneVivaldi"
         ondragover="onDragOver(event,'vivaldi')"
         ondragleave="onDragLeave('vivaldi')"
         ondrop="onDrop(event,'vivaldi')">
      <div class="drop-hint" id="hintVivaldi">
        <div class="drop-hint-icon">🎵</div>
        <div class="drop-hint-text">카드를 여기에<br>올려놓아요</div>
      </div>
    </div>
    <div class="drop-zone now-zone" id="zoneNow"
         ondragover="onDragOver(event,'now')"
         ondragleave="onDragLeave('now')"
         ondrop="onDrop(event,'now')">
      <div class="drop-hint" id="hintNow">
        <div class="drop-hint-icon">🌡️</div>
        <div class="drop-hint-text">카드를 여기에<br>올려놓아요</div>
      </div>
    </div>
  </div>

  <!-- Feeling selector -->
  <div class="feeling-row">
    <div class="feeling-zone" id="feelVivaldi">
      <button class="feel-btn" onclick="selectFeel('v','생생해요')">🌿 생생해요</button>
      <button class="feel-btn" onclick="selectFeel('v','아름다워요')">✨ 아름다워요</button>
      <button class="feel-btn" onclick="selectFeel('v','신나요')">🎶 신나요</button>
      <button class="feel-btn" onclick="selectFeel('v','평화로워요')">😌 평화로워요</button>
    </div>
    <div class="feeling-zone" id="feelNow">
      <button class="feel-btn" onclick="selectFeel('n','걱정돼요')">😟 걱정돼요</button>
      <button class="feel-btn" onclick="selectFeel('n','슬퍼요')">😢 슬퍼요</button>
      <button class="feel-btn" onclick="selectFeel('n','무서워요')">😨 무서워요</button>
      <button class="feel-btn" onclick="selectFeel('n','지켜야 해요')">💪 지켜야 해요</button>
    </div>
  </div>

  <!-- Tray -->
  <div class="tray-area">
    <div class="tray-label">카드를 끌어서 위에 올려놓으세요 👆</div>
    <div class="tray-cards" id="trayCards"></div>
  </div>
</div>

<script>
/* ── DATA ── */
const SEASONS = {
  spring: {
    name:'봄', emoji:'🌸',
    vTitle:'🎻 비발디의 봄', nTitle:'🌍 지금 우리의 봄',
    cards:[
      {id:'sp01',e:'🌸',n:'벚꽃',side:'vivaldi'},
      {id:'sp02',e:'🐦',n:'새 소리',side:'vivaldi'},
      {id:'sp03',e:'🌊',n:'시냇물',side:'vivaldi'},
      {id:'sp04',e:'🦋',n:'나비',side:'vivaldi'},
      {id:'sp05',e:'🌼',n:'들꽃',side:'vivaldi'},
      {id:'sp06',e:'☁️',n:'미세먼지',side:'now'},
      {id:'sp07',e:'🌡️',n:'이상고온',side:'now'},
      {id:'sp08',e:'🏭',n:'공장 매연',side:'now'},
      {id:'sp09',e:'🧯',n:'산불',side:'now'},
      {id:'sp10',e:'🥵',n:'열돔',side:'now'},
    ]
  },
  summer: {
    name:'여름', emoji:'☀️',
    vTitle:'🎻 비발디의 여름', nTitle:'🌍 지금 우리의 여름',
    cards:[
      {id:'su01',e:'⛈️',n:'폭풍우',side:'vivaldi'},
      {id:'su02',e:'🌻',n:'해바라기',side:'vivaldi'},
      {id:'su03',e:'🌊',n:'파도',side:'vivaldi'},
      {id:'su04',e:'🦟',n:'매미',side:'vivaldi'},
      {id:'su05',e:'☀️',n:'뜨거운 태양',side:'vivaldi'},
      {id:'su06',e:'🌪️',n:'슈퍼 태풍',side:'now'},
      {id:'su07',e:'🏜️',n:'극심한 가뭄',side:'now'},
      {id:'su08',e:'🧊',n:'빙하 소멸',side:'now'},
      {id:'su09',e:'💧',n:'물 부족',side:'now'},
      {id:'su10',e:'🌡️',n:'폭염',side:'now'},
    ]
  },
  autumn: {
    name:'가을', emoji:'🍂',
    vTitle:'🎻 비발디의 가을', nTitle:'🌍 지금 우리의 가을',
    cards:[
      {id:'au01',e:'🍂',n:'단풍',side:'vivaldi'},
      {id:'au02',e:'🍎',n:'풍성한 수확',side:'vivaldi'},
      {id:'au03',e:'🌾',n:'황금 들판',side:'vivaldi'},
      {id:'au04',e:'🦔',n:'동물 먹이',side:'vivaldi'},
      {id:'au05',e:'🌕',n:'보름달',side:'vivaldi'},
      {id:'au06',e:'🌿',n:'단풍 감소',side:'now'},
      {id:'au07',e:'🐛',n:'해충 증가',side:'now'},
      {id:'au08',e:'🏚️',n:'홍수 피해',side:'now'},
      {id:'au09',e:'💨',n:'이상 건조',side:'now'},
      {id:'au10',e:'😷',n:'알레르기',side:'now'},
    ]
  },
  winter: {
    name:'겨울', emoji:'❄️',
    vTitle:'🎻 비발디의 겨울', nTitle:'🌍 지금 우리의 겨울',
    cards:[
      {id:'wi01',e:'❄️',n:'눈',side:'vivaldi'},
      {id:'wi02',e:'⛄',n:'눈사람',side:'vivaldi'},
      {id:'wi03',e:'🧊',n:'얼음',side:'vivaldi'},
      {id:'wi04',e:'🔥',n:'따뜻한 난로',side:'vivaldi'},
      {id:'wi05',e:'🌨️',n:'눈보라',side:'vivaldi'},
      {id:'wi06',e:'🌊',n:'해수면 상승',side:'now'},
      {id:'wi07',e:'🐻‍❄️',n:'북극곰 위기',side:'now'},
      {id:'wi08',e:'🌡️',n:'따뜻한 겨울',side:'now'},
      {id:'wi09',e:'🏔️',n:'빙하 소멸',side:'now'},
      {id:'wi10',e:'❓',n:'눈 없는 겨울',side:'now'},
    ]
  }
};

let curSeason = 'spring';
let dragCard  = null;   /* {id, emoji, name} */
let vivaldiCards = [];  /* placed card objects */
let nowCards = [];
let feelV = null, feelN = null;

/* ── SEASON SWITCH ── */
function switchSeason(s) {
  curSeason = s;
  document.querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.s-tab.' + s).classList.add('active');

  const d = SEASONS[s];
  document.getElementById('vivaldiTitle').textContent = d.vTitle;
  document.getElementById('nowTitle').textContent     = d.nTitle;

  vivaldiCards = []; nowCards = [];
  feelV = null; feelN = null;
  document.querySelectorAll('.feel-btn').forEach(b => b.classList.remove('selected-v','selected-n'));

  renderZone('vivaldi');
  renderZone('now');
  renderTray();
}

/* ── RENDER TRAY ── */
function renderTray() {
  const tray = document.getElementById('trayCards');
  tray.innerHTML = '';
  const d = SEASONS[curSeason];
  d.cards.forEach(c => {
    const used = vivaldiCards.some(x=>x.id===c.id) || nowCards.some(x=>x.id===c.id);
    const el = document.createElement('div');
    el.className = 'tray-card' + (used?' used':'');
    el.id = 'tc-' + c.id;
    el.dataset.id    = c.id;
    el.dataset.emoji = c.e;
    el.dataset.name  = c.n;
    el.draggable = true;
    el.innerHTML = '<div class="tc-emoji">'+c.e+'</div><div class="tc-name">'+c.n+'</div>';
    /* mouse drag */
    el.addEventListener('dragstart', e => startDragCard(e, c.id, c.e, c.n));
    /* touch drag */
    el.addEventListener('touchstart', onTouchStart, {passive:false});
    tray.appendChild(el);
  });
}

/* ── RENDER DROP ZONE ── */
function renderZone(which) {
  const arr  = which==='vivaldi' ? vivaldiCards : nowCards;
  const zone = document.getElementById('zone' + cap(which));
  const hint = document.getElementById('hint' + cap(which));

  /* remove existing dropped cards */
  zone.querySelectorAll('.dropped-card').forEach(el=>el.remove());

  hint.classList.toggle('hidden', arr.length > 0);

  arr.forEach(c => {
    const el = document.createElement('div');
    el.className = 'dropped-card';
    el.dataset.id = c.id;
    el.draggable  = true;
    el.innerHTML  =
      '<div class="d-emoji">'+c.e+'</div>'+
      '<div class="d-name">'+c.n+'</div>'+
      '<button class="remove-btn" onclick="removeCard(\''+which+'\',\''+c.id+'\')">✕</button>';
    el.addEventListener('dragstart', e => startDragCard(e, c.id, c.e, c.n, which));
    el.addEventListener('touchstart', onTouchStart, {passive:false});
    zone.appendChild(el);
  });

  renderTray();
}

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ── MOUSE DRAG ── */
function startDragCard(e, id, emoji, name, fromZone) {
  dragCard = {id, emoji, name, fromZone: fromZone||null};
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
}

function onDragOver(e, which) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.getElementById('zone'+cap(which)).classList.add('drag-over');
}

function onDragLeave(which) {
  document.getElementById('zone'+cap(which)).classList.remove('drag-over');
}

function onDrop(e, which) {
  e.preventDefault();
  document.getElementById('zone'+cap(which)).classList.remove('drag-over');
  if (!dragCard) return;
  placeCard(which, dragCard);
  dragCard = null;
}

/* ── TOUCH DRAG ── */
let touchCard = null;
let ghost = null;

function onTouchStart(e) {
  e.preventDefault();
  const el    = e.currentTarget;
  const id    = el.dataset.id;
  const emoji = el.dataset.emoji;
  const name  = el.dataset.name;

  /* find which zone (if it's a dropped card) */
  let fromZone = null;
  if (el.classList.contains('dropped-card')) {
    fromZone = el.closest('#zoneVivaldi') ? 'vivaldi' : 'now';
  }

  touchCard = {id, emoji, name, fromZone};
  dragCard  = touchCard;

  /* show ghost */
  const g = document.getElementById('ghost');
  document.getElementById('ghostEmoji').textContent = emoji;
  document.getElementById('ghostName').textContent  = name;
  g.style.display = 'flex';

  const t = e.touches[0];
  g.style.left = t.clientX + 'px';
  g.style.top  = t.clientY + 'px';

  document.addEventListener('touchmove',  onTouchMove,  {passive:false});
  document.addEventListener('touchend',   onTouchEnd,   {passive:false});
  document.addEventListener('touchcancel',onTouchCancel,{passive:false});
}

function onTouchMove(e) {
  e.preventDefault();
  const t = e.touches[0];
  const g = document.getElementById('ghost');
  g.style.left = t.clientX + 'px';
  g.style.top  = t.clientY + 'px';

  /* highlight drop zones */
  ['zoneVivaldi','zoneNow'].forEach(id => {
    const zone = document.getElementById(id);
    const rect = zone.getBoundingClientRect();
    const over = t.clientX >= rect.left && t.clientX <= rect.right &&
                 t.clientY >= rect.top  && t.clientY <= rect.bottom;
    zone.classList.toggle('drag-over', over);
  });
}

function onTouchEnd(e) {
  e.preventDefault();
  document.getElementById('ghost').style.display = 'none';
  document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('drag-over'));

  const t = e.changedTouches[0];
  let dropped = false;

  ['vivaldi','now'].forEach(which => {
    const zone = document.getElementById('zone'+cap(which));
    const rect = zone.getBoundingClientRect();
    if (t.clientX >= rect.left && t.clientX <= rect.right &&
        t.clientY >= rect.top  && t.clientY <= rect.bottom) {
      placeCard(which, touchCard);
      dropped = true;
    }
  });

  cleanup();
}

function onTouchCancel() {
  document.getElementById('ghost').style.display = 'none';
  document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('drag-over'));
  cleanup();
}

function cleanup() {
  touchCard = null;
  dragCard  = null;
  document.removeEventListener('touchmove',  onTouchMove);
  document.removeEventListener('touchend',   onTouchEnd);
  document.removeEventListener('touchcancel',onTouchCancel);
}

/* ── PLACE CARD ── */
function placeCard(which, card) {
  if (!card) return;

  /* remove from old zone if moving between zones */
  if (card.fromZone && card.fromZone !== which) {
    removeCard(card.fromZone, card.id, false);
  } else if (card.fromZone === which) {
    return; /* dropped on same zone */
  }

  const arr = which==='vivaldi' ? vivaldiCards : nowCards;

  /* don't duplicate */
  if (arr.some(c=>c.id===card.id)) return;
  /* max 6 per zone */
  if (arr.length >= 6) return;

  arr.push({id:card.id, e:card.emoji, n:card.name});
  renderZone(which);
}

function removeCard(which, id, rerender=true) {
  if (which==='vivaldi') vivaldiCards = vivaldiCards.filter(c=>c.id!==id);
  else                   nowCards     = nowCards.filter(c=>c.id!==id);
  if (rerender) renderZone(which);
}

/* ── FEELING ── */
function selectFeel(side, word) {
  if (side==='v') {
    feelV = word;
    document.querySelectorAll('#feelVivaldi .feel-btn').forEach(b=>{
      b.classList.toggle('selected-v', b.textContent.includes(word));
    });
  } else {
    feelN = word;
    document.querySelectorAll('#feelNow .feel-btn').forEach(b=>{
      b.classList.toggle('selected-n', b.textContent.includes(word));
    });
  }
}

/* ── COMPLETE ── */
function checkComplete() {
  const s = SEASONS[curSeason];
  let msg = [];
  if (!vivaldiCards.length) msg.push('왼쪽에 카드를 놓아요');
  if (!nowCards.length)     msg.push('오른쪽에 카드를 놓아요');
  if (!feelV)               msg.push('왼쪽 느낌을 골라요');
  if (!feelN)               msg.push('오른쪽 느낌을 골라요');

  const overlay = document.getElementById('completeOverlay');
  if (msg.length) {
    document.getElementById('coTitle').textContent = '아직 조금 더!';
    document.getElementById('coSub').textContent   = msg.join(', ') + ' 💪';
  } else {
    document.getElementById('coTitle').textContent = '완성! 잘 했어요 ' + s.emoji;
    document.getElementById('coSub').textContent   =
      '"' + (feelV||'?') + '" 에서 "' + (feelN||'?') + '"으로…\n' +
      s.name + '이(가) 변하고 있어요. 함께 지켜요! 🌍';
  }
  overlay.classList.add('show');
}

function resetAll() {
  if (!confirm('처음부터 다시 할까요?')) return;
  switchSeason(curSeason);
}

/* ── INIT ── */
switchSeason('spring');
</script>
