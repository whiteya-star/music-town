<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트레팍 발레 열차</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: 기차표 헤더 + 노선도(정거장 8곳) + 한 번에 한 정거장. 갤럭시탭 가로 화면, 큰 터치 버튼 */
  --ink:#0e1730;
  --panel:#172443;
  --panel-2:#21315a;
  --line:#33477a;
  --gold:#e2bd62;
  --crimson:#c8404d;
  --snow:#f5f2ea;
  --ice:#93c8ea;
  --muted:#aab4cd;
  --good:#5fcf8f;
  --bad:#f08374;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"Noto Sans KR","Noto Sans",system-ui,sans-serif;
  --cyr:"Playfair Display","Noto Serif",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--snow);font-family:var(--body);font-size:19px;line-height:1.55}
body{min-height:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:2rem}
h3{font-size:1.3rem;color:var(--gold)}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* 기차표 헤더 */
.ticket{display:flex;align-items:stretch;gap:0;margin:16px 0 10px;background:linear-gradient(100deg,#7d1f2b,#a72f3c 55%,#7d1f2b);border-radius:14px;position:relative;overflow:hidden}
.ticket .main{flex:1;padding:14px 22px;display:flex;flex-direction:column;gap:2px}
.ticket .kicker{font-size:.8rem;letter-spacing:.14em;color:#ffd9a0}
.ticket h1{font-size:1.75rem}
.ticket .cyr{font-family:var(--cyr);color:var(--gold);font-size:1rem;letter-spacing:.06em}
.ticket .stub{width:330px;border-left:3px dashed rgba(255,255,255,.35);padding:12px 16px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.ticket .stub small{color:#ffd9a0;font-size:.78rem}
.stampcount{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.mini{min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);cursor:pointer;font-size:.85rem}

/* 노선도 */
.rail{position:relative;display:flex;gap:6px;overflow-x:auto;padding:12px 4px 10px;scrollbar-width:thin}
.rail::before{content:"";position:absolute;left:30px;right:30px;top:40px;height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 26px);border-radius:3px}
.stop{position:relative;flex:1 0 108px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0 2px;min-height:96px}
.stop .dot{position:relative;width:58px;height:58px;border-radius:50%;background:var(--panel);border:4px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:1.25rem;z-index:1;transition:transform .2s}
.stop .lbl{font-size:.88rem;color:var(--muted);text-align:center;font-weight:700}
.stop.on .dot{border-color:var(--gold);background:var(--gold);color:var(--ink);transform:scale(1.08)}
.stop.on .lbl{color:var(--snow)}
.stop.done .dot{border-color:var(--crimson)}
.stop.done .dot::after{content:"✔";position:absolute;top:-8px;right:-8px;background:var(--crimson);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:.8rem}

main{padding-bottom:110px}
.st-head{display:flex;gap:18px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin:10px 0 18px}
.eyebrow{color:var(--gold);font-weight:700;font-size:.9rem;letter-spacing:.06em}
.lead{color:var(--muted);margin-top:6px;max-width:62ch;font-size:1.05rem}
.head-btns{display:flex;gap:10px;flex-wrap:wrap}

.grid{display:grid;gap:18px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.three{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.four{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{min-height:60px;padding:10px 20px;border-radius:14px;border:2px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:700;font-size:1.05rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,background .2s,border-color .2s;text-decoration:none;color:var(--snow)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.red{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn.ghost{background:transparent}
.btn.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,189,98,.35) inset}
.btn.ok{background:var(--good);border-color:var(--good);color:#0b2416}
.btn.no{background:var(--bad);border-color:var(--bad);color:#2b0c08}
.btn.big{min-height:84px;font-size:1.3rem;padding:12px 26px}
.feedback{min-height:1.6em;font-weight:700;font-size:1.1rem}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:999px;padding:8px 16px;font-weight:700}
.muted{color:var(--muted)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* 정거장1 위치 */
.compass{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:10px;align-items:center;justify-items:center}
.compass [data-d="북"]{grid-column:2;grid-row:1}
.compass [data-d="서"]{grid-column:1;grid-row:2}
.compass .center{grid-column:2;grid-row:2;background:var(--snow);color:var(--ink);font-weight:900;border-radius:14px;padding:16px 10px;text-align:center;width:100%}
.compass [data-d="동"]{grid-column:3;grid-row:2}
.compass [data-d="남"]{grid-column:2;grid-row:3}
.compass .btn{width:100%}
.sizegrid{display:grid;grid-template-columns:repeat(19,1fr);gap:3px}
.sizegrid i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.07)}
.sizegrid i.kr{background:var(--crimson);outline:2px solid #fff}
.sizegrid i.ru{background:var(--ice)}
.count{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ice)}
.route svg{width:100%;height:auto;display:block}
.route text{fill:var(--snow);font-family:var(--body);font-weight:700}
.flag{display:inline-block;width:48px;height:32px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.flag i{display:block;height:33.34%}

/* 정거장2 날씨 */
.thermo-wrap{position:relative;display:flex;gap:18px;align-items:center;justify-content:center;border-radius:14px;overflow:hidden;background:linear-gradient(#24365f,#101b36);padding:12px;min-height:330px}
.thermo-wrap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.thermo-wrap svg{height:300px;position:relative}
.temp-big{position:relative;font-size:3.6rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ice);min-width:3.6em;text-align:center}
.suitcase{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#5b3a26;border:6px solid #3c2617;border-radius:18px;padding:14px;position:relative}
.suitcase::before{content:"";position:absolute;top:-26px;left:50%;width:90px;height:22px;margin-left:-45px;border:6px solid #3c2617;border-bottom:0;border-radius:12px 12px 0 0}
.slot{aspect-ratio:1.3;border:2px dashed rgba(255,255,255,.3);border-radius:12px;display:grid;place-items:center;font-size:2.4rem}
.slot.full{border-style:solid;border-color:var(--gold);background:rgba(255,255,255,.08)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.item{min-height:104px;flex-direction:column;gap:2px;font-size:.92rem}
.item .ic{font-size:2.4rem;line-height:1}
.item svg{width:46px;height:46px}
.item.used{opacity:.25;pointer-events:none}

/* 정거장3 문화 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{min-height:150px;flex-direction:column;gap:6px;border-radius:16px}
.tile svg{width:78px;height:78px}
.tile.seen{border-color:var(--crimson)}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:300px;flex-wrap:wrap;padding:70px 0 10px}
.doll{cursor:pointer;background:none;border:0;padding:0}
.doll svg{display:block;overflow:visible}
.doll .top{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.doll.open .top{transform:translate(-18px,-44px) rotate(-16deg)}
.doll .hollow{opacity:0;transition:opacity .3s}
.doll.open .hollow{opacity:1}
.countru{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.countru span{background:var(--panel-2);border-radius:12px;padding:6px 14px;text-align:center;min-width:86px;opacity:.25;transition:opacity .3s}
.countru span.lit{opacity:1;outline:2px solid var(--gold)}
.countru b{display:block;font-family:var(--cyr);font-size:1.25rem}
.bala-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.bala-wrap svg{width:200px;height:auto}
.str{stroke:#f3e7c9;stroke-width:2.4}
.hitstr{stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
.str.vib{animation:vib .08s linear 6}
@keyframes vib{50%{transform:translateX(2px)}}
.cathedral svg{width:100%;max-width:520px;margin:0 auto;display:block}
.dome{cursor:pointer;stroke:#3a1d12;stroke-width:2}
.soup svg{width:260px;max-width:100%;margin:0 auto;display:block}

/* 정거장4 말 */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.word{flex-direction:column;align-items:flex-start;text-align:left;min-height:150px;gap:2px}
.word .ru{font-family:var(--cyr);font-size:1.7rem;color:var(--gold);line-height:1.2}
.word .pr{font-size:1.25rem;font-weight:900}
.word .mean{color:var(--muted);font-weight:500}
.word .ic{font-size:1.8rem;align-self:flex-end;margin-top:-6px}
.qbox{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.qtext{font-size:1.45rem;font-weight:900;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.opt{min-height:110px;flex-direction:column;font-size:1.15rem}
.opt .ic{font-size:2.4rem;line-height:1}
.opt svg{width:56px;height:56px}
.progress{display:flex;gap:6px;justify-content:center}
.progress i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.progress i.g{background:var(--good)}
.progress i.b{background:var(--bad)}

/* 정거장5 차이콥스키 */
.profile{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.profile svg{width:150px;height:150px;flex:none}
.profile .cyrname{font-family:var(--cyr);color:var(--gold);font-size:1.15rem}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;position:relative}
.tl{flex-direction:column;min-height:110px;gap:2px;font-size:.95rem}
.tl b{font-size:1.4rem;color:var(--gold);font-variant-numeric:tabular-nums}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .pic svg{width:80px;height:80px}
.match .done{opacity:.55;border-color:var(--good)}

/* 정거장6 발레 */
.fig{width:100%;height:auto;max-height:230px}
.fig .limbs line{stroke:var(--snow);stroke-width:11;stroke-linecap:round}
.fig .headc{fill:var(--snow)}
.fig .ground{stroke:var(--line);stroke-width:4}
.fig .hat{fill:var(--crimson)}
.poses{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pose{flex-direction:column;min-height:200px;gap:4px;padding:10px}
.pose svg{max-height:130px}
.freeze{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1.2fr);gap:18px;align-items:center}
.freeze-stage{background:var(--panel-2);border-radius:18px;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;position:relative}
.freeze-stage .fig{max-height:260px;width:auto;height:260px}
.freeze-stage .pname{font-family:var(--display);font-size:2.2rem;color:var(--gold)}
.ring{font-size:3rem;font-weight:900;width:92px;height:92px;border-radius:50%;border:6px solid var(--gold);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.beatdots{display:flex;gap:14px;justify-content:center}
.beatdots i{width:34px;height:34px;border-radius:50%;background:var(--line);transition:transform .08s,background .08s}
.beatdots i.hit{background:var(--gold);transform:scale(1.35)}
.infocard svg{width:90px;height:90px}

/* 정거장7 음악 */
.facts{display:flex;gap:10px;flex-wrap:wrap}
.form{display:flex;gap:6px;align-items:stretch}
.form div{border-radius:10px;padding:12px 8px;text-align:center;font-weight:900;font-size:1.3rem;color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs .btn{flex:1 1 140px}
.rhythm{display:flex;gap:14px;align-items:flex-end;justify-content:center;padding:6px}
.beat{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px}
.beat .gl{height:58px;display:flex;align-items:center;gap:4px}
.beat .ta{width:46px;height:46px;border-radius:50%;background:var(--gold)}
.beat .ti{width:28px;height:28px;border-radius:50%;background:var(--ice)}
.beat .rest{width:42px;height:42px;border-radius:8px;border:3px dashed var(--muted)}
.beat .nm{font-weight:900}
.beat .sym{font-size:1.5rem;color:var(--muted);line-height:1}
.rhy-opt{flex-direction:column;padding:12px}
.rhy-opt .rhythm{transform:scale(.85)}
.slider{display:flex;flex-direction:column;gap:6px}
.slider input{width:100%;height:44px;accent-color:var(--gold)}
.dyn{font-family:var(--cyr);font-style:italic;font-size:2.4rem;color:var(--gold);min-width:2.2em;text-align:center}
.tamb{width:190px;height:190px;border-radius:50%;border:14px solid #b8873e;background:radial-gradient(#f3e3c0,#dcc391);cursor:pointer;position:relative;display:grid;place-items:center;color:#5a3d14;font-weight:900;font-size:1.1rem}
.tamb.hit{animation:tamb .18s}
@keyframes tamb{50%{transform:rotate(-8deg) scale(.95)}}
.dynbtn .ic{font-family:var(--cyr);font-style:italic}

/* 정거장8 */
.final-ticket{background:linear-gradient(120deg,#f6ecd2,#e9d6a6);color:#3a210f;border-radius:16px;display:flex;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:820px;margin:0 auto;width:100%}
.final-ticket .l{flex:1;padding:22px 26px;display:flex;flex-direction:column;gap:6px;border-right:3px dashed #a7864a}
.final-ticket .r{width:200px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.final-ticket .ru{font-family:var(--cyr);font-size:1.6rem;color:#8c1d27;letter-spacing:.05em}
.final-ticket h3{color:#3a210f;font-size:1.6rem}
.final-ticket input{font:inherit;font-size:1.4rem;font-weight:900;border:0;border-bottom:3px solid #8c1d27;background:transparent;color:#3a210f;width:100%;max-width:300px;padding:4px}
.seal{width:120px;height:120px;border-radius:50%;border:5px double #b0242f;color:#b0242f;display:grid;place-items:center;font-weight:900;transform:rotate(-12deg);font-family:var(--display);font-size:1.05rem;text-align:center;line-height:1.2}

/* 모달, 도장 */
.overlay{position:fixed;inset:0;background:rgba(5,9,20,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:720px;width:100%;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.vlinks{display:grid;gap:10px}
.vlink{justify-content:flex-start;text-align:left}
.vlink small{display:block;color:var(--muted);font-weight:500}
.stampfx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;pointer-events:none;flex-direction:column;gap:12px}
.stampfx.show{display:flex}
.stampfx .big{width:230px;height:230px;border-radius:50%;border:10px double #ff6b78;color:#ff6b78;background:rgba(14,23,48,.85);display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:2rem;line-height:1.2;animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both;transform:rotate(-12deg)}
@keyframes stamp{from{transform:scale(2.6) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55;width:100%;height:100%}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:rgba(14,23,48,.94);border-top:1px solid var(--line);z-index:20}
.bottombar .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.hidden{display:none!important}
@media (max-width:720px){
  h2{font-size:1.55rem}
  .ticket{flex-direction:column}
  .ticket .stub{width:auto;border-left:0;border-top:3px dashed rgba(255,255,255,.35)}
  .freeze{grid-template-columns:1fr}
  .final-ticket{flex-direction:column}
  .final-ticket .l{border-right:0;border-bottom:3px dashed #a7864a}
  .final-ticket .r{width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="ticket">
    <div class="main">
      <span class="kicker">음악 · 2차시 · 발레 음악 「호두까기 인형」</span>
      <h1>트레팍 발레 열차 · 모스크바행</h1>
      <span class="cyr">МОСКВА · ТРЕПАК · ЧАЙКОВСКИЙ</span>
    </div>
    <div class="stub">
      <small>모은 도장</small>
      <span class="stampcount" id="stampCount">0 / 8</span>
      <div class="tools">
        <button class="mini" id="ttsBtn" type="button">🔊 읽어주기 켜짐</button>
        <button class="mini" id="resetBtn" type="button">↺ 처음부터</button>
      </div>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="정거장"></nav>
  <main id="main"></main>
</div>

<div class="bottombar"><div class="wrap">
  <button class="btn" id="prevBtn" type="button">◀ 이전 정거장</button>
  <button class="btn primary" id="nextBtn" type="button">다음 정거장 ▶</button>
</div></div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="stampfx" id="stampfx"><div class="big" id="stampBig">참 잘했어요</div></div>
<canvas id="confetti"></canvas>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

/* ---------- 타이머 관리 (정거장 이동 시 정리) ---------- */
let timers=[]; let token=0;
function later(fn,ms){const t=token;const id=setTimeout(()=>{if(t===token)fn()},ms);timers.push(id);return id}
function clearTimers(){timers.forEach(clearTimeout);timers=[];token++}

/* ---------- 음성(TTS) ---------- */
let ttsOn=true; let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
const voiceFor=l=>voices.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(l));
function say(text,lang='ko',rate=0.92){
  if(!ttsOn||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=voiceFor(lang);u.lang=lang==='ru'?'ru-RU':'ko-KR';if(v)u.voice=v;u.rate=rate;speechSynthesis.speak(u)}catch(e){}
}
function sayRu(ru,ko){ if(voiceFor('ru')) say(ru,'ru',0.8); else say(ko,'ko',0.85) }

/* ---------- 소리(Web Audio) ---------- */
let AC=null,master=null,noiseBuf=null;const plCache={};
function ac(){
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();return AC}
function env(g,t,peak,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dec)}
function noise(t,type,freq,peak,dec,out){const a=ac();const s=a.createBufferSource();s.buffer=noiseBuf;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=a.createGain();env(g,t,peak,dec);s.connect(f).connect(g).connect(out||master);s.start(t);s.stop(t+dec+.05)}
function tamb(t,v=1,out){noise(t,'highpass',7000,.55*v,.16,out);noise(t+.025,'bandpass',9000,.3*v,.12,out);noise(t+.05,'highpass',8000,.18*v,.1,out)}
function kick(t,v=1,out){const a=ac();const o=a.createOscillator();const g=a.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(48,t+.14);env(g,t,.9*v,.28);o.connect(g).connect(out||master);o.start(t);o.stop(t+.3)}
function snare(t,v=1,out){noise(t,'bandpass',1800,.5*v,.13,out)}
function tone(t,f,v,dec,type='triangle',out){const a=ac();const o=a.createOscillator();o.type=type;o.frequency.value=f;const g=a.createGain();env(g,t,v,dec);o.connect(g).connect(out||master);o.start(t);o.stop(t+dec+.05)}
function wood(t,v=1,out){tone(t,1050,.35*v,.05,'sine',out)}
function pluckBuf(f){const k=Math.round(f);if(plCache[k])return plCache[k];const a=ac();const sr=a.sampleRate;const len=Math.floor(sr*1.4);const b=a.createBuffer(1,len,sr);const d=b.getChannelData(0);const N=Math.round(sr/f);for(let i=0;i<N;i++)d[i]=Math.random()*2-1;for(let i=N;i<len;i++)d[i]=.497*(d[i-N]+d[i-N-1]);plCache[k]=b;return b}
function pluck(t,f,v=1,out){const a=ac();const s=a.createBufferSource();s.buffer=pluckBuf(f);const g=a.createGain();g.gain.value=.45*v;s.connect(g).connect(out||master);s.start(t)}
function chime(){const a=ac();const t=a.currentTime;[523.3,659.3,784,1046.5].forEach((f,i)=>tone(t+i*.08,f,.25,.5,'sine'))}
function buzz(){const a=ac();const t=a.currentTime;tone(t,220,.18,.2,'square');tone(t+.16,174.6,.18,.3,'square')}

/* 러시아풍 반주 리듬(2/4박자): 쿵-짝 + 탬버린 + 발랄라이카 스트럼. 실제 트레팍 선율은 아님 */
const Groove={playing:false,bpm:150,vol:.8,accel:false,step:0,next:0,timer:null,bus:null,onBeat:null,onTempo:null,
  start(){const a=ac();if(this.playing)return;this.bus=a.createGain();this.bus.gain.value=this.vol;this.bus.connect(master);this.playing=true;this.step=0;this.next=a.currentTime+.06;this.timer=setInterval(()=>this.tick(),25)},
  stop(){if(!this.playing)return;this.playing=false;clearInterval(this.timer);const b=this.bus;if(b){b.gain.setTargetAtTime(0,AC.currentTime,.03);setTimeout(()=>{try{b.disconnect()}catch(e){}},500)}this.accel=false},
  setVol(v){this.vol=v;if(this.bus)this.bus.gain.setTargetAtTime(v,AC.currentTime,.05)},
  tick(){while(this.next<AC.currentTime+.12){this.play(this.step,this.next);this.next+=60/this.bpm/2;this.step++;if(this.accel&&this.step%2===0){this.bpm=Math.min(230,this.bpm+3);this.onTempo&&this.onTempo(this.bpm)}}},
  play(s,t){const i=s%4,bar=Math.floor(s/4)%4,G=bar<2,b=this.bus;
    if(i===0){kick(t,1,b);tone(t,G?98:73.42,.5,.25,'triangle',b)}
    if(i===2){snare(t,.75,b);tone(t,G?146.8:110,.45,.2,'triangle',b)}
    if(i===1||i===3){tamb(t,.8,b);(G?[196,246.9,293.7]:[146.8,185,220]).forEach((f,k)=>pluck(t+k*.012,f,.55,b))}
    if(i%2===0&&this.onBeat){const d=Math.max(0,(t-AC.currentTime)*1000);const n=i/2;setTimeout(()=>this.onBeat&&this.onBeat(n),d)}}
};
function playFor(sec,{bpm=150,vol=.8}={},done){Groove.stop();Groove.bpm=bpm;Groove.vol=vol;Groove.start();later(()=>{Groove.stop();done&&done()},sec*1000)}

const KEY='trepak2-stamps';
let stamps={};try{stamps=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){stamps={}}

function award(id){
  const st=STATIONS.find(s=>s.id===id);
  if(stamps[id]){return}
  stamps[id]=true;saveStamps();renderRail();
  $('#stampBig').innerHTML=`${st.n}<br>참 잘했어요`;
  const fx=$('#stampfx');fx.classList.add('show');chime();confetti();say(`${st.n} 도장을 받았어요. 참 잘했어요!`);
  setTimeout(()=>fx.classList.remove('show'),2300);
}
function confetti(){
  const c=$('#confetti');const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#e2bd62','#c8404d','#93c8ea','#f5f2ea','#5fcf8f'];
  const P=Array.from({length:140},()=>({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,s:6+Math.random()*7,c:cols[Math.floor(Math.random()*5)],r:Math.random()*6}));
  let f=0;(function run(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<110)requestAnimationFrame(run);else x.clearRect(0,0,c.width,c.height)})();
}

function go(i){
  Groove.stop();Groove.onBeat=null;Groove.onTempo=null;clearTimers();try{speechSynthesis.cancel()}catch(e){}

/* 공용 퀴즈 */
function quiz(box,Q,onEnd){
  let i=0,score=0;const res=[];
  const show=()=>{
    if(i>=Q.length){const msg=onEnd(score);box.innerHTML=`<p class="qtext">${msg}</p><div class="progress">${res.map(r=>`<i class="${r?'g':'b'}"></i>`).join('')}</div>`;say(msg.replace(/<[^>]+>/g,''));return}
    const q=Q[i];
    box.innerHTML=`<div class="progress">${Q.map((_,k)=>`<i class="${k<i?(res[k]?'g':'b'):''}"></i>`).join('')}</div>
     <p class="qtext">${q.q}</p>${q.sub?`<div style="text-align:center">${q.sub}</div>`:''}
     ${q.replay?`<div class="row" style="justify-content:center"><button class="btn" data-rep type="button">🔊 다시 듣기</button></div>`:''}
     <div class="opts">${q.opts.map((o,k)=>`<button class="btn opt" data-o="${k}" type="button">${o.h}</button>`).join('')}</div>
     <p class="feedback" data-fb></p>`;
    if(q.replay)$('[data-rep]',box).onclick=q.replay;
    let answered=false;
    $$('[data-o]',box).forEach(b=>b.onclick=()=>{
      if(answered)return;const o=q.opts[+b.dataset.o];ac();
      if(o.ok){answered=true;b.classList.add('ok');if(res[i]===undefined){res[i]=true;score++}chime();const g=q.good||'정답!';fb($('[data-fb]',box),true,g);say(g);later(()=>{i++;show()},1900)}
      else{if(res[i]===undefined)res[i]=false;b.classList.add('no','shake');buzz();fb($('[data-fb]',box),false,'다시 한 번 골라 볼까요?')}
    });
    if(q.onShow)later(q.onShow,300);else say(q.q.replace(/<[^>]+>/g,''));
  };show();
}

     <p class="feedback" id="mFb"></p></div>

      fb($('#mFb'),true,`${b.dataset.n} — ${t}`);say(`${b.dataset.n}. ${t}`);pick=null;
      if(count===3)setTimeout(()=>award('tchai'),2400)}

     <div class="freeze">
       <div class="stack">

/* ===== 7. 음악 탐정 ===== */
const RHY=[['ti','ti','ta','ta'],['ta','ti','ta','r'],['ti','ta','ti','ta'],['ta','ta','ti','ta'],['ti','ti','ti','r']];
function rhyHTML(p){return `<div class="rhythm">${p.map(b=>`<div class="beat"><div class="gl">${b==='ta'?'<i class="ta"></i>':b==='ti'?'<i class="ti"></i><i class="ti"></i>':'<i class="rest"></i>'}</div><span class="sym">${b==='ta'?'♩':b==='ti'?'♫':'𝄽'}</span><span class="nm">${b==='ta'?'타':b==='ti'?'티티':'쉼'}</span></div>`).join('')}</div>`}
function playRhy(p,bpm=88){const a=ac();const sp=60/bpm;const t0=a.currentTime+.15;p.forEach((b,i)=>{const t=t0+i*sp;wood(t,.35);if(b==='ta')tamb(t,1.1);if(b==='ti'){tamb(t,1.1);tamb(t+sp/2,1.1)}});return p.length*sp}
function renderMusic(m,st){

  <div class="stack">
   <div class="card"><h3>트레팍 음악 카드</h3>
     <div class="facts">
       <span class="chip">⏱️ 빠르기: 매우 빠르고 생기 있게 <i class="muted">(molto vivace)</i></span>
       <span class="chip">💪 셈여림: 대부분 세게 <span class="dyn" style="font-size:1.4rem">f</span></span>
       <span class="chip">🎵 2/4박자 · 쿵-짝</span>
       <span class="chip">🥁 탬버린이 신나게!</span>
       <span class="chip">⏳ 약 1분의 짧은 곡</span>
     </div>
     <p style="font-weight:700">곡의 짜임(형식)</p>
     <div class="form"><div style="flex:3;background:var(--gold)">A</div><div style="flex:2;background:var(--ice)">B</div><div style="flex:3;background:var(--gold)">A</div><div style="flex:1.4;background:var(--crimson);color:#fff">코다<br><small>점점 빠르게!</small></div></div>
   </div>
   <div class="card"><div class="row" style="justify-content:space-between"><h3>음악 탐정 문제</h3><span class="chip">맞힌 문제 <span id="mScore">0</span> / 6</span></div>
     <div class="tabs">${[['tempo','⏱️ 빠르기'],['dyn','🔊 셈여림'],['rhy','🥁 리듬'],['cond','🎼 지휘자 되기']].map(([k,t],i)=>`<button class="btn ${i===0?'sel':''}" data-tab="${k}" type="button">${t}</button>`).join('')}</div>
     <div id="mBox" class="qbox" style="margin-top:8px"></div></div>
  </div>`;
  let total=0;const plus=()=>{total++;$('#mScore').textContent=Math.min(total,6);if(total===6)setTimeout(()=>award('music'),1500)};
  const box=$('#mBox');
  const tabs={
    tempo(){
      const T=[{k:'slow',n:'느리게',it:'Adagio',bpm:62,ic:'🐢'},{k:'mid',n:'보통 빠르게',it:'Moderato',bpm:104,ic:'🚶'},{k:'fast',n:'매우 빠르게',it:'Vivace',bpm:176,ic:'🏃'}];
      let ans=null;
      box.innerHTML=`<p class="qtext">음악을 듣고 빠르기를 골라요</p><div class="row" style="justify-content:center"><button class="btn primary big" id="tPlay" type="button">▶ 음악 듣기</button></div>
      <div class="opts">${T.map(t=>`<button class="btn opt" data-k="${t.k}" type="button"><span class="ic">${t.ic}</span>${t.n}<small class="muted"><i>${t.it}</i></small></button>`).join('')}</div><p class="feedback" data-fb></p>`;
      $('#tPlay').onclick=()=>{ans=T[Math.floor(Math.random()*3)];$$('.opt',box).forEach(b=>b.className='btn opt');playFor(5,{bpm:ans.bpm,vol:.8});fb($('[data-fb]',box),true,'')};
      $$('.opt',box).forEach(b=>b.onclick=()=>{if(!ans){fb($('[data-fb]',box),false,'먼저 ▶ 음악 듣기를 눌러요.');return}
        if(b.dataset.k===ans.k){b.classList.add('ok');chime();plus();const g=ans.k==='fast'?'정답! 트레팍처럼 매우 빠르게!':`정답! ${ans.n}였어요.`;fb($('[data-fb]',box),true,g+' 다시 ▶를 눌러 다음 문제!');say(g);ans=null;Groove.stop()}
        else{b.classList.add('no','shake');buzz();fb($('[data-fb]',box),false,'다시 들어 볼까요?')}});
    },
    dyn(){
      let ans=null;
      box.innerHTML=`<p class="qtext">음악을 듣고 셈여림을 골라요</p><div class="row" style="justify-content:center"><button class="btn primary big" id="dPlay" type="button">▶ 음악 듣기</button></div>
      <div class="opts"><button class="btn opt dynbtn" data-k="p" type="button"><span class="ic" style="font-size:1.6rem">p</span>여리게 (피아노)</button><button class="btn opt dynbtn" data-k="f" type="button"><span class="ic" style="font-size:3.4rem">f</span>세게 (포르테)</button></div><p class="feedback" data-fb></p>`;
      $('#dPlay').onclick=()=>{ans=Math.random()<.5?'p':'f';$$('.opt',box).forEach(b=>b.className='btn opt dynbtn');playFor(4,{bpm:150,vol:ans==='p'?.14:1.1})};
      $$('.opt',box).forEach(b=>b.onclick=()=>{if(!ans){fb($('[data-fb]',box),false,'먼저 ▶ 음악 듣기를 눌러요.');return}
        if(b.dataset.k===ans){b.classList.add('ok');chime();plus();const g=ans==='f'?'정답! 세게, 포르테! 트레팍은 대부분 세게 연주해요.':'정답! 여리게, 피아노!';fb($('[data-fb]',box),true,g+' 다시 ▶를 눌러 다음 문제!');say(g);ans=null;Groove.stop()}
        else{b.classList.add('no','shake');buzz();fb($('[data-fb]',box),false,'다시 들어 볼까요?')}});
    },
    rhy(){
      const opts=shuffle(RHY).slice(0,3);const ans=opts[Math.floor(Math.random()*3)];let played=false;
      box.innerHTML=`<p class="qtext">탬버린 리듬을 듣고, 같은 그림 악보를 골라요</p><div class="row" style="justify-content:center"><button class="btn primary big" id="rPlay" type="button">▶ 리듬 듣기</button><button class="btn big" id="rNew" type="button">↻ 새 문제</button></div>
      <div class="opts">${opts.map((p,i)=>`<button class="btn opt rhy-opt" data-i="${i}" type="button">${rhyHTML(p)}</button>`).join('')}</div><p class="feedback" data-fb></p>
      <div class="row" style="justify-content:center;margin-top:10px"><div class="tamb" id="tambPad" role="button" tabindex="0" aria-label="탬버린">탬버린<br>치기</div><p class="muted" style="max-width:30ch">맞혔으면 탬버린을 눌러 직접 따라 쳐 봐요!</p></div>`;
      $('#rPlay').onclick=()=>{played=true;playRhy(ans)};$('#rNew').onclick=tabs.rhy;
      const pad=$('#tambPad');const hit=()=>{tamb(ac().currentTime,1.2);pad.classList.remove('hit');void pad.offsetWidth;pad.classList.add('hit')};pad.onpointerdown=hit;pad.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hit()}};
      let solved=false;
      $$('.opt',box).forEach(b=>b.onclick=()=>{if(!played){fb($('[data-fb]',box),false,'먼저 ▶ 리듬 듣기를 눌러요.');return}if(solved)return;
        if(opts[+b.dataset.i]===ans){solved=true;b.classList.add('ok');chime();plus();fb($('[data-fb]',box),true,'정답! ↻ 새 문제를 눌러 계속해요.');say('정답!');later(()=>playRhy(ans),700)}
        else{b.classList.add('no','shake');buzz();fb($('[data-fb]',box),false,'다시 들어 볼까요?')}});
    },
    cond(){
      const tname=b=>b<80?'느리게 (Adagio)':b<120?'보통 빠르게 (Moderato)':b<160?'빠르게 (Allegro)':'매우 빠르게 (Vivace)';
      const dname=v=>v<.2?'pp':v<.4?'p':v<.6?'mp':v<.8?'mf':v<1?'f':'ff';
      const dko={pp:'아주 여리게',p:'여리게',mp:'조금 여리게',mf:'조금 세게',f:'세게',ff:'아주 세게'};
      box.innerHTML=`<p class="qtext">지휘자가 되어 빠르기와 셈여림을 바꿔 봐요</p>
      <div class="beatdots" style="margin:6px 0"><i></i><i></i></div>
      <div class="grid two">
        <div class="slider"><label for="bpmR" style="font-weight:700">⏱️ 빠르기: <span id="bpmL"></span></label><input id="bpmR" type="range" min="50" max="220" value="100"><span class="muted">🐢 느리게 ←→ 빠르게 🏃</span></div>
        <div class="slider"><label for="volR" style="font-weight:700">🔊 셈여림: <span class="dyn" id="dynL">mf</span> <span id="dynK"></span></label><input id="volR" type="range" min="5" max="120" value="65"><span class="muted">여리게 ←→ 세게</span></div>
      </div>
      <div class="row" style="justify-content:center"><button class="btn primary big" id="cPlay" type="button">▶ 연주 시작</button><button class="btn big" id="cTrepak" type="button">🇷🇺 트레팍처럼!</button><button class="btn red big" id="cAccel" type="button">🚀 점점 빠르게 (코다)</button><button class="btn big" id="cStop" type="button">■ 멈춤</button></div>
      <p class="feedback good" id="cFb"></p>`;
      const bpmR=$('#bpmR'),volR=$('#volR');
      const upd=()=>{Groove.bpm=+bpmR.value;$('#bpmL').textContent=`${bpmR.value} · ${tname(+bpmR.value)}`;const v=volR.value/100;Groove.setVol(v);const d=dname(v);$('#dynL').textContent=d;$('#dynK').textContent=dko[d]};
      bpmR.oninput=()=>{Groove.accel=false;upd()};volR.oninput=upd;upd();
      Groove.onBeat=n=>{const d=$$('#mBox .beatdots i');d.forEach(x=>x.classList.remove('hit'));if(d[n])d[n].classList.add('hit')};
      Groove.onTempo=b=>{bpmR.value=b;$('#bpmL').textContent=`${b} · ${tname(b)}`};
      $('#cPlay').onclick=()=>{Groove.vol=volR.value/100;Groove.bpm=+bpmR.value;Groove.start();$('#cFb').textContent=''};
      $('#cStop').onclick=()=>Groove.stop();
      $('#cTrepak').onclick=()=>{bpmR.value=168;volR.value=100;Groove.accel=false;upd();Groove.vol=1;Groove.start();$('#cFb').textContent='트레팍은 매우 빠르고 세게! 탬버린 소리에 맞춰 몸을 흔들어요.';say('트레팍은 매우 빠르고 세게!')};
      $('#cAccel').onclick=()=>{if(!Groove.playing){Groove.vol=volR.value/100;Groove.start()}Groove.accel=true;$('#cFb').textContent='트레팍의 마지막 부분(코다)처럼 점점 빠르게! 이걸 "아첼레란도"라고 해요.';say('트레팍의 마지막 부분처럼 점점 빠르게! 아첼레란도!')};
    }
  };
  $$('[data-tab]',m).forEach(b=>b.onclick=()=>{Groove.stop();Groove.onBeat=null;Groove.onTempo=null;clearTimers();$$('[data-tab]',m).forEach(x=>x.classList.toggle('sel',x===b));tabs[b.dataset.tab]()});
  tabs.tempo();
}

/* ===== 8. 볼쇼이 극장 ===== */
function renderFinal(m,st){
  m.innerHTML=head(st,'오늘 배운 것을 퀴즈로 확인하고, 볼쇼이 극장 입장권을 받아요!')+`<div class="card"><div id="fq" class="qbox"></div></div>`;
  const Q=[
    {q:'러시아의 수도는 어디일까요?',opts:[['🏛️ 모스크바',1],['🗼 파리',0],['🏯 서울',0]]},
    {q:'러시아는 대한민국의 어느 쪽에 있을까요?',opts:[['▲ 북쪽',1],['▼ 남쪽',0]]},
    {q:'모스크바 겨울 여행에 꼭 필요한 것은?',opts:[['<span class="ic">🧤</span>장갑',1],['<span class="ic">🩳</span>반바지',0],['<span class="ic">🩴</span>슬리퍼',0]]},
    {q:'인형 안에 더 작은 인형이 들어 있는 러시아 인형은?',opts:[[dollSVG('fq','#c8404d',.4)+'마트료시카',1],['<span class="ic">🧸</span>곰 인형',0]]},
    {q:'러시아 말로 "고마워요"는?',opts:[['스파시바',1],['프리비엣',0],['니엣',0]]},
    {q:'「호두까기 인형」을 작곡한 사람은?',opts:[['차이콥스키',1],['베토벤',0],['모차르트',0]]},
    {q:'트레팍의 빠르기는?',opts:[['<span class="ic">🏃</span>매우 빠르게',1],['<span class="ic">🐢</span>아주 느리게',0]]},
    {q:'발끝으로 설 수 있게 만든 발레 신발은?',opts:[['<span class="ic">🩰</span>토슈즈',1],['<span class="ic">🥾</span>털부츠',0]]}
  ];
  quiz($('#fq'),Q.map(q=>({q:q.q,opts:shuffle(q.opts).map(([h,ok])=>({h,ok:!!ok}))})),score=>{
    award('bolshoi');
    later(()=>showTicket(m,score),2200);
    return `8문제 중 ${score}개 정답! 입장권을 준비하고 있어요…`;
  });
}
function showTicket(m,score){
  const n=STATIONS.filter(s=>stamps[s.id]).length;const d=new Date();
  const date=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
  m.querySelector('.card').innerHTML=`<div class="final-ticket">
    <div class="l"><span class="ru">БИЛЕТ · БОЛЬШОЙ ТЕАТР</span><h3>볼쇼이 극장 입장권</h3>
      <p>공연: 발레 「호두까기 인형」 2막 · 트레팍(러시아의 춤)</p><p>작곡: 차이콥스키</p>
      <label for="tName" style="font-weight:700;margin-top:6px">입장객 이름</label><input id="tName" placeholder="이름을 써요" autocomplete="off">
      <p style="margin-top:6px">날짜: ${date} · 퀴즈 ${score}/8 · 도장 ${n}/8</p></div>
    <div class="r"><div class="seal">참 잘<br>했어요</div><small>좌석: 1층 맨 앞줄</small><span style="font-size:1.6rem">🩰🎄🪆</span></div>
  </div><p class="muted" style="text-align:center;margin-top:12px">이름을 쓰고 화면을 캡처해서 친구들에게 보여 주세요. 다음 시간에 진짜 트레팍 공연 영상을 볼 거예요!</p>
  <div class="row" style="justify-content:center"><button class="btn red big" data-video="bolshoi" type="button">▶ 볼쇼이 극장 영상관</button></div>`;
  confetti();say('볼쇼이 극장 입장권을 받았어요! 이름을 써 보세요.');
}

const startId=(location.hash||'').slice(1);
go(Math.max(0,STATIONS.findIndex(s=>s.id===startId)));
